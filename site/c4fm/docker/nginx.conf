# The C4FM fork's site (site/c4fm/README.md). Plain HTTP on port 80: TLS is the reverse proxy's. The web installer's
# WebSerial and WebUSB work only on https (or localhost), so the public address must be https.
server {
	listen 80;
	listen [::]:80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	server_tokens off;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header X-Frame-Options DENY always;

	error_page 404 /404.html;

	# scripts, styles and images carry ?v=<hash of site/static> on every page: a new build is a new address
	location /static/ {
		add_header Cache-Control "public, max-age=604800";
		add_header X-Content-Type-Options nosniff always;
	}

	# pages, data and the firmware change with each build: always asked again (an unchanged file is a 304)
	location / {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options nosniff always;
		try_files $uri $uri/ =404;
	}
}
