# C4FMFoundry, the C4FM fork's site, on a server (site/c4fm/README.md): behind a reverse proxy that serves it on https.
#   TAG=v26.11 docker compose up -d
services:
  site:
    image: c4fmfoundry-site:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
